name: Import checked portfolio source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-portfolio.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify and unpack reviewed source
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, zipfile
          archive = Path('portfolio-source.zip')
          expected = '06e39d46976f0282a71147364d82f31e387edc3277562e88ba2c6ee6f3e63ae5'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected, 'Bundle checksum mismatch'
          with zipfile.ZipFile(archive) as bundle:
              for name in bundle.namelist():
                  parts = PurePosixPath(name).parts
                  assert not name.startswith('/') and '..' not in parts and '\\' not in name
                  assert parts[0] not in ('.git', '.github')
              bundle.extractall('.')
          PY
      - name: Verify complete site
        run: |
          npm run build
          npm run check
      - name: Commit source files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content scripts public
          git rm portfolio-source.zip
          git commit -m 'Import checked portfolio source and project assets'
          git push
